# Watchtower backend (simulator + detector + kill switch). Bound to localhost; nginx (host network) proxies to it.
services:
  fred-hackathon:
    build: .
    image: fred-hackathon
    container_name: fred-hackathon
    restart: unless-stopped
    ports:
      - "127.0.0.1:8800:8800"
    env_file: .env                       # SWARM_KEY, LITELLM_MASTER_KEY, LITELLM_URL (+ optional FABRIC_* later)
    volumes:
      - ./backend:/app/backend:ro        # edit without rebuilding (restart the container to reload)
      - ./data:/app/data:ro              # agents.json: one LiteLLM key per agent (written by setup/bootstrap.py, git-ignored)
    networks: [default, service-plane_default]

networks:
  service-plane_default:
    external: true
